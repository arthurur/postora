---
name: Build Containers

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-containers-common:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.metadata.outputs.image }}
      version: ${{ steps.metadata.outputs.version }}
      build: ${{ steps.metadata.outputs.build }}
    steps:
      - name: Get image metadata
        id: metadata
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "build=build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

  build-containers:
    needs: build-containers-common
    strategy:
      matrix:
        include:
          - runnertags: ubuntu-latest
            arch: amd64
            dockerfile: Dockerfile.dev
            suffix: ''
          - runnertags: ubuntu-latest
            arch: amd64
            dockerfile: apps/marketing-site/Dockerfile
            suffix: '-marketing'
          - runnertags: ubuntu-24.04-arm
            arch: arm64
            dockerfile: Dockerfile.dev
            suffix: ''
          - runnertags: ubuntu-24.04-arm
            arch: arm64
            dockerfile: apps/marketing-site/Dockerfile
            suffix: '-marketing'
    runs-on: ${{ matrix.runnertags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        env:
          IMAGE: ${{ needs.build-containers-common.outputs.image }}
          VERSION: ${{ needs.build-containers-common.outputs.version }}
          BUILD: ${{ needs.build-containers-common.outputs.build }}
          ARCH: ${{ matrix.arch }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          docker buildx build --platform "linux/${ARCH}" \
            -f "${DOCKERFILE}" \
            -t "${IMAGE}:${BUILD}${SUFFIX}-${ARCH}" \
            --build-arg "NEXT_PUBLIC_VERSION=${VERSION}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --pull \
            --provenance=false --sbom=false \
            --push .

  build-container-manifest:
    needs: [build-containers, build-containers-common]
    runs-on: ubuntu-latest
    concurrency:
      group: publish-container-main
      cancel-in-progress: false
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish commit image and update main
        env:
          IMAGE: ${{ needs.build-containers-common.outputs.image }}
          VERSION: ${{ needs.build-containers-common.outputs.version }}
          BUILD: ${{ needs.build-containers-common.outputs.build }}
          GH_TOKEN: ${{ github.token }}
        run: |
          docker buildx imagetools create -t "${IMAGE}:${VERSION}" \
            "${IMAGE}:${BUILD}-amd64" \
            "${IMAGE}:${BUILD}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
          docker buildx imagetools create -t "${IMAGE}:marketing-${VERSION}" \
            "${IMAGE}:${BUILD}-marketing-amd64" \
            "${IMAGE}:${BUILD}-marketing-arm64"
          docker buildx imagetools inspect "${IMAGE}:marketing-${VERSION}"

          # Rerunning an older commit must not move the main image backwards.
          main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          if [ "$main_sha" = "$GITHUB_SHA" ]; then
            docker buildx imagetools create -t "${IMAGE}:marketing-main" "${IMAGE}:marketing-${VERSION}"
            docker buildx imagetools inspect "${IMAGE}:marketing-main"
            docker buildx imagetools create -t "${IMAGE}:main" "${IMAGE}:${VERSION}"
            docker buildx imagetools inspect "${IMAGE}:main"
          else
            echo "Published ${VERSION}; main has moved on, so its image was not updated."
          fi
